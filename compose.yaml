name: little-shop

services:
  api:
    build:
      context: ./src/backend
    volumes:
      - shop-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "127.0.0.1:${SHOP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  shop-data:
